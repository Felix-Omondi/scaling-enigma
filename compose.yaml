services:
  api:
    build: .
    image: scaling-enigma:1.0
    container_name: enigma_api_service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    ports:
      - "8081:8080"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres
    container_name: enigma_database_service
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5454:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  # GUI for inspecting tables and running queries
  adminer:
    image: adminer
    container_name: enigma_database_gui
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  pgdata:
